<body>
<div id="app">
<div class="top"><div class="stw" id="stw"></div><div class="tbx" id="t_all" onclick="goView('all')">履歴</div><div class="tbx" id="t_tbl" onclick="goView('tbl')">表</div><div class="tbx" id="t_stats" onclick="goView('stats')">判別</div><div class="tbx" id="t_data" onclick="goView('data')">管理</div></div>
<div class="stat" id="stat"></div>
<div class="subs" id="subs"><div class="sub" id="u_hist" onclick="goSub('hist')">履歴</div><div class="sub" id="u_pt" onclick="goSub('pt')">ポイント</div><div class="sub" id="u_memo" onclick="goSub('memo')">下メモ</div></div>
<div class="main" id="main"></div>
<div class="ia" id="ia">
<div class="crb">
<button class="chb" id="c_red" onclick="selCh('red')"><span class="cbd" style="background:#e44"></span></button>
<button class="chb" id="c_green" onclick="selCh('green')"><span class="cbd" style="background:#3d3"></span></button>
<button class="chb" id="c_blue" onclick="selCh('blue')"><span class="cbd" style="background:#a55ef0"></span></button>
</div>
<div class="grid" id="pad">
<button class="sb big" style="grid-area:1/1/4/3" data-s="○">○</button>
<button class="sb big" style="grid-area:1/3/4/5" data-s="◎">◎</button>
<button class="sb big" style="grid-area:4/1/7/3" data-s="●">●</button>
<button class="sb big fl" style="grid-area:4/3/7/5" id="flb" onclick="togFl()">発光中</button>
<button class="sb sm" style="grid-area:1/5/3/6" data-s="☆">☆</button>
<button class="sb sm" style="grid-area:1/6/3/7" data-s="◇">◇</button>
<button class="sb sm" style="grid-area:3/5/5/6" data-s="★">★</button>
<button class="sb sm" style="grid-area:3/6/5/7" data-s="◆">◆</button>
<button class="sb sm" style="grid-area:5/5/7/6" data-s="🦋">🦋</button>

</div>

<div class="bw"><button class="bpm" onclick="chgBell(1)">＋</button><span id="bellV" class="bv">🔔0</span><button class="bpm" onclick="chgBell(-1)">－</button></div>
<button class="rb" style="color:#c9a24a" id="dnb" onclick="addSym('↓')">↓</button><button class="rb" style="color:#d9798a;font-size:15px" id="bkb" onclick="doBack()">戻</button>
</div>

<script>
var KEY='kb2v8';
var SP={'🦋':0,'○':1,'◎':15,'●':15,'☆':15,'★':30,'◇':30,'◆':60,'＊':0,'/':0,'↓':0};
/* 🟣カバネpt：チャンス目 低確1・高確2、複合☆2★4（仮）、オルスタ◇2◆4 */
var SPB={'🦋':0,'○':1,'◎':2,'●':2,'☆':2,'★':4,'◇':2,'◆':4,'＊':0,'/':0,'↓':0};
var BMAX=14;
var CIR='①②③④⑤⑥⑦⑧⑨⑩';
var STATES=['リセット','非短縮','短縮','上位後短縮'];
var KIRI=['侑那','鰍','無名','菖蒲','寝転び無名','桜の無名'];
var RINNE=['一廻以内に好機有','二廻以内に好機有','三廻以内に好機有','四廻以内に好機有','一、二の廻に兆し有','一、三の廻に兆し有','二、三の廻に兆し有','二、四の廻に兆し有','三、四の廻に兆し有','一、二、三の廻に兆し有','一、二、四の廻に兆し有','一、三、四の廻に兆し有','輪廻の果報があらんことを','六根清浄','無名・小吉','生駒・小吉','無名・中吉','生駒・中吉'];
var ITEMS=[['ツラヌキ筒','設定4で出現しづらい'],['無名の短銃','設定3で出現しづらい'],['自決袋','設定1で出現しづらい'],['来栖の刀','設定2・3否定（6で出やすい）'],['無名のけん玉','設定1・3否定（6で出やすい）'],['菖蒲の弓','高設定期待度UP'],['ミヤマカラスアゲハ','高設定期待度UP(強)'],['小吉','設定2以上濃厚'],['中吉','設定4以上濃厚'],['大吉','設定6濃厚']];
var SHOKICHI={1:'設定6',2:'設定2＆6',3:'設定3＆6',4:'設定4＆6',5:'設定5＆6'};
var CHIPS=['侑那','鰍','無名','景行','来栖','生駒','菖蒲','銅トロ','銀トロ','金トロ','麒麟トロ','集合','解放','コンボ','黒煙','もうすぐ','おみくじ'];
var RESL={'':'<span class="pend">結果？</span>','x':'❌','rb':'⬛','bb':'🟦','fuku':'複合🟦'};
var HOWL={pt:'pt到達',g:'規定G',super:'超'};
var TL={cz:'CZ',up:'🟪格上',cyc:'周期',os:'オルスタ',sug:'示唆'};
var DB=null,UI=null,SH=null,C=null,TWO='',TWOT=null;

function gi(id){return document.getElementById(id);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function plain(s){return String(s).replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function circ(n){n=+n;return(n>=1&&n<=10)?CIR.charAt(n-1):(n?'('+n+')':'');}
function isNum(v){return v!==''&&v!=null&&!isNaN(+v);}
function newSec(st,carry){return{id:uid(),state:st,carry:!!carry,bell:0,memo:'',nowG:'',end:null};}
function newSess(){return{id:uid(),info:{date:today(),store:'',dai:''},totalG:'',gmemo:'',secs:[newSec('リセット',false)],ev:[],tk:[]};}
function validSess(s){return s&&s.secs&&s.secs.length&&s.ev&&s.tk&&s.info;}
function validDB(d){return d&&d.list&&d.list.length&&d.list.every(validSess);}
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(validDB(d))DB=d;}catch(e){}
  if(!DB)DB={cur:0,list:[newSess()]};
  fixUI();
}
function fixUI(){
  if(!DB.ui)DB.ui={};UI=DB.ui;
  if(DB.cur==null||DB.cur>=DB.list.length)DB.cur=0;
  if(!UI.view)UI.view='sec';if(!UI.sub)UI.sub='hist';if(!UI.ch)UI.ch='red';if(!UI.fl)UI.fl={red:0,green:0,blue:0};
  if(UI.sec==null||UI.sec>=P().secs.length)UI.sec=P().secs.length-1;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('保存に失敗しました');}}
function P(){return DB.list[DB.cur];}
function cs(){return P().secs[UI.sec];}
function secById(id){var r=null;P().secs.forEach(function(s){if(s.id===id)r=s;});return r;}
function secIdx(id){var r=-1;P().secs.forEach(function(s,i){if(s.id===id)r=i;});return r;}
function evById(id){var r=null;P().ev.forEach(function(e){if(e.id===id)r=e;});return r;}
function evsOf(sid){return P().ev.filter(function(e){return e.sec===sid;}).sort(function(a,b){return a.ord-b.ord;});}
/* 表示用：G数順（G未入力の行は直前の行のGに付いていく／同じGは入力順） */
function evsByG(sid){
  var es=evsOf(sid),k=[],last=-1;
  es.forEach(function(e,i){if(isNum(e.g))last=+e.g;k.push({e:e,g:last,i:i});});
  k.sort(function(a,b){return a.g-b.g||a.i-b.i;});
  return k.map(function(x){return x.e;});
}
function nextOrd(sid){var m=0;P().ev.forEach(function(e){if(e.sec===sid&&e.ord>m)m=e.ord;});return m+1;}
function cycAt(sid,ord){var n=0;P().ev.forEach(function(e){if(e.sec===sid&&e.t==='cyc'&&(ord==null||e.ord<ord))n++;});return n+1;}
function curG(sc){var m=isNum(sc.nowG)?+sc.nowG:0;P().ev.forEach(function(e){if(e.sec===sc.id&&isNum(e.g)&&+e.g>m)m=+e.g;});return m;}
function isST(e){return e.res==='bb'||e.res==='fuku'||(e.res==='rb'&&e.rbRes==='o');}
function autoSTG(sc){var l=null;evsByG(sc.id).forEach(function(e){if(isST(e)&&isNum(e.g))l=+e.g;});return l;}
function stG(sc){if(sc.end){if(isNum(sc.end.ngOv))return +sc.end.ngOv;var a=autoSTG(sc);if(a!=null)return a;}return curG(sc);}
function pendOS(sc){var r=null;evsOf(sc.id).forEach(function(e){if(e.t==='os'&&!e.link)r=e;});return r;}
function pendUp(sc,skip){var r=null;evsOf(sc.id).forEach(function(e){if(e.t==='up'&&!e.fol)r=e;});return r;}
function pendCount(){return P().ev.filter(function(e){return(e.t==='cz'||e.t==='up'||e.t==='cyc')&&!e.res;}).length;}

/* ポイント計算：記号トークンを時系列で流して再計算 */
function calc(){
  var p=P(),r={end:{},start:{},cut:{}},prev={red:0,green:0};
  p.secs.forEach(function(sc){
    var pt={red:sc.carry?prev.red:0,green:sc.carry?prev.green:0,blue:0};
    r.start[sc.id]={red:pt.red,green:pt.green};
    p.tk.forEach(function(t){
      if(t.sec!==sc.id)return;
      if(t.k==='s'){pt[t.ch]+=(t.ch==='blue'?SPB:SP)[t.s]||0;}
      else{if(!r.cut[t.ev])r.cut[t.ev]={};r.cut[t.ev][t.ch]=pt[t.ch];pt[t.ch]=0;}
    });
    r.end[sc.id]=pt;prev=pt;
  });
  C=r;return r;
}
function cutv(id,ch){return C.cut[id]&&C.cut[id][ch]!=null?C.cut[id][ch]:null;}
function evPt(e){
  if(e.t==='cz'){if(isNum(e.ptOv))return +e.ptOv;return cutv(e.id,e.ch);}
  if(e.t==='cyc'){if(isNum(e.bptOv))return +e.bptOv;return cutv(e.id,'blue');}
  return null;
}

/* 表示用 */
function gTxt(e){return isNum(e.g)?(e.g+(e.ap?'ぐらい':'')):(e.ap?'?ぐらい':'');}
function rbTxt(e){
  if(e.res!=='rb')return '';
  var s='';if(isNum(e.rbPt))s+=' RB'+e.rbPt;
  if(e.rbRes==='o')s+='⭕';else if(e.rbRes==='x')s+='❌';else s+=' <span class="pend">RB結果？</span>';
  if(+e.tan)s+=' 単'+e.tan+(+e.t3k?'(3000×'+e.t3k+')':'');
  return s;
}
function evLine(e){
  var g=gTxt(e),s='',v,r,gg;
  if(e.t==='cz'){
    v=e.fol?null:evPt(e);
    s=circ(e.cyc)+g+' '+(e.ch==='red'?'🟥':'🟩')+(e.fol?' 後続':'')+(v!=null?' .'+v:'')+' '+RESL[e.res||'']+rbTxt(e);
    if(isNum(e.geki))s+=' '+e.geki+'撃破';
    if(e.ch==='green'&&lifeTxt(e))s+=' <span class="dim">'+lifeTxt(e)+'</span>';
    if(isNum(e.goal))s+='(目標'+e.goal+')';
  }else if(e.t==='up'){
    s=circ(e.cyc)+g+' 🟪格上 '+RESL[e.res||'']+rbTxt(e);
    r=cutv(e.id,'red');gg=cutv(e.id,'green');
    if(r!=null)s+=' <span class="dim">🔴'+r+' 🟢'+gg+' 銅藍A</span>';
  }else if(e.t==='os'){
    s=g+' オルスタ'+e.s;
    r=cutv(e.id,'red');gg=cutv(e.id,'green');
    if(r!=null)s+=' <span class="dim">🔴'+r+' 🟢'+gg+' 銅藍A</span>';
    s+=e.link?' <span class="dim">→🟪</span>':' <span class="dim">🟪待ち</span>';
  }else if(e.t==='cyc'){
    v=evPt(e);
    if(e.ten)s=circ(e.cyc)+g+' '+(e.ten==='g'?'G天井':'周期天井')+'🟦';else
    s=circ(e.cyc)+g+' 🟣'+(HOWL[e.how]||'')+(v!=null?(e.how==='pt'?' .'+v:' ('+v+')'):'')+' '+RESL[e.res||'']+rbTxt(e);
  }else if(e.t==='sug'){
    s=sugTxt(e,true);
  }
  if(e.note)s+=' <span class="dim">'+esc(e.note)+'</span>';
  if(e.ins)s+=' <span class="dim">[挿入]</span>';
  return s;
}
function omkSp(n){n=+n;return n>=1&&(n<=5||n%5===0);}
function sugTxt(e,html){
  var k=e.kind||'free';
  if(k==='kiri')return 'キリ番 '+circ(e.cyc)+esc(e.val);
  if(k==='rinne'||k==='item'){
    var n=e.n+'回目';if(html&&omkSp(e.n))n='<span class="pend">'+n+'</span>';
    return n+' '+circ(e.cyc)+esc(e.val)+(e.rf?' 赤':'');
  }
  return (gTxt(e)?gTxt(e)+' ':'')+'示唆 '+esc(e.txt);
}
function sugLines(sc){
  var G=[['kiri','キリ番'],['item','アイテム'],['rinne','輪廻'],['free','示唆']],h='';
  var es=evsOf(sc.id).filter(function(e){return e.t==='sug';});
  G.forEach(function(g){
    var a=es.filter(function(e){return (e.kind||'free')===g[0];});if(!a.length)return;
    h+='<div class="sl"><span class="dim">'+g[1]+'：</span>'+a.map(function(e){
      var t=g[0]==='free'?(gTxt(e)?gTxt(e)+' ':'')+esc(e.txt):circ(e.cyc)+esc(e.val)+(e.rf?'赤':'');
      return '<span class="sli" onclick="openEdit(\''+e.id+'\')">'+t+'</span>';
    }).join('')+'</div>';
  });
  return h;
}
function secSum(sc){
  var k=[],r=[];
  evsByG(sc.id).forEach(function(e){if(e.t!=='sug')return;if(e.kind==='kiri')k.push(circ(e.cyc)+esc(e.val));if(e.kind==='rinne')r.push(circ(e.cyc)+esc(e.val));});
  var o=[];if(k.length)o.push('キリ番：'+k.join(' '));if(r.length)o.push('輪廻：'+r.join(' '));
  return o.join('／');
}
function nextOmk(){var m=0;P().ev.forEach(function(e){if(e.t==='sug'&&(e.kind==='rinne'||e.kind==='item')&&+e.n>m)m=+e.n;});return m+1;}
function stLine(sc){
  if(!sc.end)return '';
  return 'ST '+(isNum(sc.end.ren)?sc.end.ren:'?')+'連'+(isNum(sc.end.mai)?' '+sc.end.mai+'枚':'')+'　通常'+stG(sc)+'G'+(sc.end.chars&&sc.end.chars.length?'<br>'+esc(charsTxt(sc.end.chars)):'')+(sc.end.memo?'<br>'+esc(sc.end.memo).replace(/\n/g,'<br>'):'');
}
function secHist(sc,i){
  var h='<div class="sech" onclick="openSec(\''+sc.id+'\')">区間'+(i+1)+' <span>'+esc(sc.state)+'</span>'+(sc.carry?' <span class="dim">pt引継</span>':'')+' <span class="dim">✎</span></div>';
  var es=evsByG(sc.id).filter(function(e){return e.t!=='sug';}),sl=sugLines(sc);
  if(!es.length)h+='<div class="er dim">まだ記録なし</div>';
  es.forEach(function(e){h+='<div class="er'+(e.t==='sug'?' sm':'')+'" onclick="openEdit(\''+e.id+'\')">'+evLine(e)+'</div>';});
  if(sc.end)h+='<div class="stf" onclick="openSec(\''+sc.id+'\')">'+stLine(sc)+'</div>';
  if(UI.view==='all'&&sl)h+=sl;
  if(sc.memo)h+='<div class="smemo">'+esc(sc.memo)+'</div>';
  return h;
}
function ptText(sc,ch){
  var o='',st=C.start[sc.id];
  if(ch!=='blue'&&sc.carry&&st[ch]>0)o+='('+st[ch]+')→\n';
  P().tk.forEach(function(t){
    if(t.sec!==sc.id||t.ch!==ch)return;
    if(t.k==='s'){o+=t.fl?'['+t.s+']':t.s;return;}
    var e=evById(t.ev),v=cutv(t.ev,ch);if(!e)return;
    if(ch==='blue')o+=circ(e.cyc)+(e.how==='pt'?'.'+v:(e.how==='super'?'超('+v+')':'('+v+')'));
    else o+='.'+v+(e.t==='cz'?'':'銅藍A');
    o+='\n';
  });
  return o;
}
function ptView(sc){
  var DC={red:'#e88a8a',green:'#7cbf8a',blue:'#b39ddb'};
  return ['red','green','blue'].map(function(c){
    return '<div class="cr"><div class="cw"><span class="cd" style="background:'+DC[c]+'"></span><span class="pb"'+(c==='blue'&&C.end[sc.id][c]>BMAX?' style="color:#c0507a"':'')+'>'+C.end[sc.id][c]+'</span></div><div class="sy">'+esc(ptText(sc,c))+'</div></div>';
  }).join('');
}

/* 描画 */
function render(){
  calc();renderTop();
  var v=UI.view,isS=v==='sec';
  gi('stat').style.display=isS?'flex':'none';
  gi('subs').style.display=isS?'flex':'none';
  gi('ia').style.display=isS?'block':'none';
  if(isS){renderStat();renderSubs();renderMain();renderIA();}
  else if(v==='all')gi('main').innerHTML=allHist();
  else if(v==='tbl')gi('main').innerHTML=tblHTML();
  else if(v==='stats')gi('main').innerHTML=statsHTML();
  else gi('main').innerHTML=dataHTML();
}
function renderTop(){
  var h='';
  P().secs.forEach(function(sc,i){h+='<div class="tb'+(UI.view==='sec'&&UI.sec===i?' on':'')+'" id="tab'+i+'" onclick="goSec('+i+')">【'+(i+1)+'】</div>';});

    '<span style="color:#d97070">●'+e.red+'</span><span style="color:#5fa86e">●'+e.green+'</span><span style="color:'+(e.blue>BMAX?'#c0507a;font-weight:bold':'#9a7fc8')+'">●'+e.blue+(e.blue>BMAX?'!':'')+'</span>';

function renderSubs(){['hist','pt','memo'].forEach(function(s){gi('u_'+s).className='sub'+(UI.sub===s?' on':'');});}

function allHist(){
  var h='';P().secs.forEach(function(sc,i){h+=secHist(sc,i);});
  return '<button class="dbt pr" style="margin:10px;width:calc(100% - 20px)" onclick="copyText(histOnly())">履歴をコピー</button>'+h+'<div class="dim" style="padding:12px">行をタップで編集・削除・挿入／区間見出しで状態変更</div>';
}

/* 判別 */
function avg(a){if(!a.length)return 'データなし';var s=0;a.forEach(function(x){s+=x;});return (s/a.length).toFixed(1)+'pt';}
function prob(n,g){if(!g)return '分母なし';if(!n)return '0回';return '1/'+(g/n).toFixed(1);}
function kv(k,v,s){return '<div class="kv"><span>'+k+'</span><span><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</span></div>';}
function flashOf(ch){var n=0,f=0;P().tk.forEach(function(t){if(t.k!=='s'||t.fl||t.ch!==ch)return;if(t.s==='○')n++;if(t.s==='◎')f++;});return{f:f,d:n+f};}
function frTxt(r){return r.d?r.f+'/'+r.d+'（'+(r.f/r.d*100).toFixed(1)+'%）':'データなし';}
function statsHTML(){
  var p=P(),ng=0,stN=0,bell=0;
  p.secs.forEach(function(sc){ng+=stG(sc)||0;if(sc.end)stN++;bell+=sc.bell||0;});
  var rb=0,bb=0,fk=0,promo=0,rbL=[],czR=[],czG=[],dR=[],dG=[],nR=0,nG=0,nU=0,nO=0,ok=0,ngc=0,pend=0,bp=[],sugs=[],cy={},cyPt={},tenG=0,tenC=0;
  function add(o,st,k,e){o[st]=o[st]||{};var c=o[st][k]=o[st][k]||{a:0,w:0,f:0};c.a++;if(e.res==='rb'||e.res==='bb')c.w++;if(e.res==='fuku')c.f++;}
  p.ev.slice().sort(function(a,b){var x=secIdx(a.sec)-secIdx(b.sec);return x||a.ord-b.ord;}).forEach(function(e){
    var sc=secById(e.sec);
    if(e.t==='cz'||e.t==='up'||e.t==='cyc'){
      if(e.res==='rb'){rb++;rbL.push(e);if(e.rbRes==='o')promo++;}
      if(e.res==='bb')bb++;if(e.res==='fuku'){bb++;fk++;}
    }
    if(e.t==='cz'||e.t==='up'){if(!e.res)pend++;else if(e.res==='x')ngc++;else ok++;}
    if(e.t==='cz'){var v=e.fol?null:evPt(e);if(e.ch==='red'){nR++;if(v!=null)czR.push(v);}else{nG++;if(v!=null)czG.push(v);}}
    if(e.t==='up'||e.t==='os'){if(e.t==='up')nU++;else nO++;var r=cutv(e.id,'red'),g=cutv(e.id,'green');if(r!=null)dR.push(r);if(g!=null)dG.push(g);}
    if(e.t==='cyc'&&e.ten){if(e.ten==='g')tenG++;else tenC++;}
    else if(e.t==='cyc'){var k=+e.cyc||0;if(e.how==='pt'){var b=evPt(e);if(b!=null)bp.push(b);add(cyPt,'pt到達(参考)',k,e);}else{add(cy,sc.state,k,e);add(cy,'合計',k,e);}}
    if(e.t==='sug')sugs.push(e);
  });
  var tg=isNum(p.totalG)?+p.totalG:0;
  var h='<div class="card"><h3>確率（分母を明記）</h3>'+
    kv('通常G',ng+'G','各区間のST当選G＋進行中の現在G')+
    kv('初当り ⬛+🟦',(rb+bb)+'回',prob(rb+bb,ng)+'（通常G）')+
    kv('⬛RB',rb+'回','BB昇格 '+promo+'/'+rb)+
    kv('🟦BB',bb+'回',fk?'うち複合 '+fk:'')+
    kv('ST初当り',stN+'回',prob(stN,ng)+'（通常G）')+
    kv('CZ 🟥+🟩+🟪',(nR+nG+nU)+'回',prob(nR+nG+nU,ng)+'（通常G）')+
    kv('内訳','🟥'+nR+' 🟩'+nG+' 🟪'+nU,'オルスタ '+nO+'回')+
    kv('CZ成功',ok+'/'+(ok+ngc),(ok+ngc?(ok/(ok+ngc)*100).toFixed(1)+'%':'データなし')+(pend?'　結果未入力 '+pend:''))+
    kv('🔔下段ベル',bell+'回',tg?prob(bell,tg)+'（総G '+tg+'）':'総G数未入力（管理で入力）')+
    '</div>';
  h+='<div class="card"><h3>到達pt平均</h3>'+
    kv('🔴',avg(czR.concat(dR)),(czR.length+dR.length)+'回（うち銅藍A '+dR.length+'）')+
    kv('🟢',avg(czG.concat(dG)),(czG.length+dG.length)+'回（うち銅藍A '+dG.length+'）')+
    kv('🔴🟢 合算',avg(czR.concat(dR,czG,dG)),(czR.length+dR.length+czG.length+dG.length)+'回')+
    kv('<span class="dim">参考：🔴 CZのみ</span>',avg(czR),czR.length+'回')+
    kv('<span class="dim">参考：🟢 CZのみ</span>',avg(czG),czG.length+'回')+
    kv('🟣 pt到達',avg(bp),bp.length+'回')+
    '</div>';
  var fR=flashOf('red'),fG=flashOf('green'),fRG={f:fR.f+fG.f,d:fR.d+fG.d};
  h+='<div class="card"><h3>低確発光率（◎÷(○+◎)）</h3>'+kv('🔴',frTxt(fR))+kv('🟢',frTxt(fG))+kv('🔴🟢',frTxt(fRG))+'</div>';
  var rows=STATES.concat(['合計']),th='<tr><th></th>';
  for(var k=1;k<=6;k++)th+='<th>'+circ(k)+'</th>';th+='</tr>';
  function cyRow(o,name){if(!o[name])return '';var t='<tr><td>'+name+'</td>';for(var k=1;k<=6;k++){var c=o[name][k];t+='<td>'+(c?c.w+'/'+c.a+(c.f?'<br><small>複込'+(c.w+c.f)+'/'+c.a+'</small>':''):'-')+'</td>';}return t+'</tr>';}
  var tb='';rows.forEach(function(n){tb+=cyRow(cy,n);});tb+=cyRow(cyPt,'pt到達(参考)');
  h+='<div class="card"><h3>周期別 当選/到達（規定G・超のみ母数）</h3>'+(tb?'<table class="ct">'+th+tb+'</table>':'<div class="dim">データなし</div>')+'<div class="dim" style="margin-top:6px">上段=⬛🟦のみ／下段=複合込み。pt到達は母数に入れず参考表示。天井は除外</div>'+kv('天井','G天井 '+tenG+'回／周期天井 '+tenC+'回')+'</div>';
  var cc={lo:{f:0,m:0,b:0},hi:{f:0,m:0,b:0}};
  p.secs.forEach(function(sc){if(sc.end&&sc.end.chars)sc.end.chars.forEach(function(x){if(cc[x.b])cc[x.b][cGrp(x.c)]++;});});
  var REF={lo:{f:[50,57.5,41.5,58.5,39.9,60],m:[50,42.5,58.5,41.4,60,39.85],b:[0,0,0,0.1,0.1,0.15]},hi:{f:[50,57.5,41.5,58.5,38,60],m:[50,42.5,58.5,39.5,60,37],b:[0,0,0,2,2,3]}};
  h+='<div class="card"><h3>ST中キャラ（女性=偶数↑／男性=3・5↑／美馬=4以上）</h3>';
  ['lo','hi'].forEach(function(b){
    var c=cc[b],n=c.f+c.m+c.b,pc=function(x){return n?(x/n*100).toFixed(1)+'%':'-';};
    h+='<div style="font-size:13px;color:#c9707f;margin-top:6px">'+CBL[b]+'（'+n+'回）</div><table class="ct"><tr><th></th><th>実測</th><th>設1</th><th>設2</th><th>設3</th><th>設4</th><th>設5</th><th>設6</th></tr>';
    [['f','女性'],['m','男性'],['b','美馬']].forEach(function(r){
      h+='<tr><td>'+r[1]+'</td><td><b>'+c[r[0]]+'</b><br><small>'+pc(c[r[0]])+'</small></td>';
      REF[b][r[0]].forEach(function(v){h+='<td style="color:#6f8a76">'+(v?v:'-')+'</td>';});
      h+='</tr>';

function addSym(s){
  var sc=cs();
  if(s==='◇'||s==='◆'){doOS(s);return;}
  if(s==='↓'&&UI.ch!=='blue'){pushTk(sc,'red','s','↓');pushTk(sc,'green','s','↓');}
  else pushTk(sc,UI.ch,'s',s,UI.fl[UI.ch]);
  save();render();
  if(UI.sub==='pt')gi('main').scrollTop=1e6;
}
function doOS(s){
  var sc=cs(),e={id:uid(),sec:sc.id,ord:nextOrd(sc.id),t:'os',s:s,g:'',ap:false,note:'',link:''};
  P().ev.push(e);
  pushTk(sc,'red','s',s,0,e.id);pushTk(sc,'green','s',s,0,e.id);pushTk(sc,'blue','s',s,0,e.id);
  pushTk(sc,'red','cut','',0,e.id);pushTk(sc,'green','cut','',0,e.id);
  save();render();
  SH={kind:'ev',isNew:false,first:true,e:JSON.parse(JSON.stringify(e))};renderSheet();
}
function doBack(){
  if(UI.sub!=='pt'){goSub('pt');toast('ポイント画面を開いたよ。確認してから戻してね');return;}
  var sc=cs(),a=P().tk;
  for(var i=a.length-1;i>=0;i--){
    var t=a[i];if(t.sec!==sc.id||t.ch!==UI.ch)continue;
    if(t.ev){
      var e=evById(t.ev),nm=e?(e.t==='os'?'オルスタ'+e.s:TL[e.t]):'';
      if(e&&e.t!=='os'&&!twoTap('bk'+t.ev))return;
      removeEv(t.ev);save();render();toast(nm+'を取り消しました');return;
    }
    a.splice(i,1);
    if(t.s==='↓'&&UI.ch!=='blue'){var o=UI.ch==='red'?'green':'red';for(var j=a.length-1;j>=0;j--){var u=a[j];if(u.sec===sc.id&&u.ch===o&&u.s==='↓'&&!u.ev){a.splice(j,1);break;}}}
    save();render();toast(t.s+' を戻しました');return;
  }
  toast('戻せる記号がありません');
}

function rightRows(sc){

      var pt=evPt(e),col='';
      if(e.t==='cz')col=e.ch==='red'?'赤':'緑';
      if(e.t==='up'||e.t==='os'){var r=cutv(e.id,'red'),g=cutv(e.id,'green');pt=r!=null?r+'/'+g:'';col='赤/緑';}
      if(e.t==='cyc')col='青';
      rows.push([i+1,sc.state,j+1,e.g,e.ap?'1':'',e.cyc||'',e.t==='os'?'オルスタ'+e.s:TL[e.t],col,pt==null?'':pt,(e.t==='cz'||e.t==='up'||e.t==='cyc')?RS[e.res||'']:'',e.geki||'',e.goal||'',e.rbPt||'',e.rbRes==='o'?'昇格':e.rbRes==='x'?'失敗':'',e.t==='cyc'?HOWL[e.how]:'',e.t==='sug'?plain(sugTxt(e,false)):e.note,e.ins?'1':'']);
    });
    if(sc.end)rows.push([i+1,sc.state,'','','','','ST終了','','','','','','','','',(sc.end.ren||'?')+'連 '+(sc.end.mai||'')+'枚 通常'+stG(sc)+'G '+charsTxt(sc.end.chars)+' '+(sc.end.memo||''),'']);
  });
  return '﻿'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('コピーしました');}).catch(function(){fbCopy(t);});}
  else fbCopy(t);
}
function fbCopy(t){var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');toast('コピーしました');}catch(e){toast('コピー失敗');}document.body.removeChild(ta);}
function dl(name,text,mime){var b=new Blob([text],{type:mime});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},800);}
function fname(ext){var p=P();return 'kb2_'+(p.info.date||'')+(p.info.dai?'_'+p.info.dai:'')+'.'+ext;}
function tblTyped(){
  var m=tblModel(),p=P(),out=[],a=function(k,r){out.push({k:k,r:r});};
  a('x',[p.info.date+' '+p.info.store+' '+p.info.dai]);
  m.S.forEach(function(r){a('S',r);});
  m.secs.forEach(function(s){a('x',['']);a('T',[s.t]);a('H',LH);s.L.forEach(function(r){a('L',r);});s.R.forEach(function(r,j){a(j?'R':'H2',r);});});
  if(p.gmemo)a('x',[p.gmemo]);
  return out;
}
function tblRows(){return tblTyped().map(function(o){return o.r;});}
var PC=['#f8d4d4','#d6f0d6','#e6d6f5'];
function cellStyle(k,i){
  var st='border:1px solid #999;padding:2px 4px;';
  if(k==='S')st+='background:#e8e8e8;';
  if(k==='H'||k==='H2')st+='background:#c8c8c8;font-weight:bold;';
  if(k==='T')st+='font-weight:bold;border-top:3px solid #000;';
  if((k==='L'||k==='H')&&i>=6&&i<=8)st+='background:'+PC[i-6]+';';
  return st;
}
function copyHist(){
  var ty=tblTyped(),rows=ty.map(function(o){return o.r;}),cl=function(c){return String(c==null?'':c).replace(/[\t\r\n]+/g,' ');};
  var html='<table style="border-collapse:collapse">'+ty.map(function(o){var n=o.k==='T'?LH.length:o.r.length;var t='<tr>';for(var i=0;i<n;i++)t+='<td style="'+cellStyle(o.k,i)+'">'+esc(cl(o.r[i]))+'</td>';return t+'</tr>';}).join('')+'</table>';
  var txt=rows.map(function(r){return r.map(cl).join('\t');}).join('\n');
  try{
    if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(function(){toast('表をコピーしました');}).catch(function(){htmlCopy(html);});
      return;
    }
  }catch(e){}
  htmlCopy(html);
}
function htmlCopy(html){
  var d=document.createElement('div');d.innerHTML=html;d.style.cssText='position:fixed;left:-9999px;top:0;-webkit-user-select:text;user-select:text';
  document.body.appendChild(d);var r=document.createRange();r.selectNodeContents(d);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  try{document.execCommand('copy');toast('表をコピーしました');}catch(e){toast('コピー失敗');}
  sel.removeAllRanges();document.body.removeChild(d);
}
function dlTbl(){
  var rows=tblRows();
  dl(fname('csv').replace('.csv','_表.csv'),'﻿'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v).replace(/[\r\n]+/g,' ');return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n'),'text/csv');
}
function copyJSON(){copyText(JSON.stringify(DB));}
function dlJSON(){dl('kb2v8_backup_'+today()+'.json',JSON.stringify(DB),'application/json');}
function copyCSV(){copyText(csvText());}
function dlCSV(){dl(fname('csv'),csvText(),'text/csv');}
function restore(){
  var t=gi('rsTa').value.trim(),d;
  try{d=JSON.parse(t);}catch(e){toast('JSONの形式が正しくありません');return;}
  if(validDB(d)){
    if(!twoTap('rs'))return;
    try{localStorage.setItem(KEY+'_bak',JSON.stringify(DB));}catch(e){}
    DB=d;fixUI();save();render();toast('復元しました（前のデータは控えに保存）');
  }else if(validSess(d)){
    if(!twoTap('rs'))return;
    DB.list.push(d);DB.cur=DB.list.length-1;UI.sec=P().secs.length-1;save();render();toast('稼働を1件追加しました');
  }else toast('このアプリのデータではありません');
}

/* 共通 */
function twoTap(k){
  if(TWO===k){TWO='';clearTimeout(TWOT);return true;}
  TWO=k;clearTimeout(TWOT);TWOT=setTimeout(function(){TWO='';},3000);
  toast('もう一度押すと実行します');return false;
}
function toast(m){var t=gi('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className='';},1600);}

load();
(function(){
  var el=gi('pad'),lp=null;
  function ep(){if(lp){clearTimeout(lp);lp=null;}}
  el.addEventListener('pointerdown',function(e){
    var s=e.target.getAttribute('data-s');if(!s)return;
    e.preventDefault();
    if('★◇◆'.indexOf(s)>=0){ep();lp=setTimeout(function(){lp=null;addSym(s);},450);}
    else addSym(s);
  });
  el.addEventListener('pointerup',ep);el.addEventListener('pointercancel',ep);el.addEventListener('pointerleave',ep);
})();
render();
