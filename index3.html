<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>カバネリ2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
html,body{height:100%;background:#0d0d0d;color:#fff;font-family:-apple-system,sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.top-bar{display:flex;background:#111;border-bottom:1px solid #2a2a2a;min-height:44px;flex-shrink:0}
.stw{flex:1;overflow-x:auto;display:flex;scrollbar-width:none}
.stw::-webkit-scrollbar{display:none}
.st{padding:10px 14px;font-size:14px;color:#666;white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;user-select:none}
.st.active{color:#fff;background:#1e3fa0;border-bottom:2px solid #3d6fe8}
.itb{padding:10px 16px;font-size:14px;color:#666;cursor:pointer;user-select:none;flex-shrink:0}
.itb.active{color:#fff;background:#1e3fa0}
.sub-bar{display:flex;border-bottom:1px solid #2a2a2a;flex-shrink:0}
.sub-tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;color:#666;cursor:pointer;user-select:none}
.sub-tab.active{color:#fff;background:#1e3fa0}
.pane{flex:1;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.pane.active{display:block}
.cr{display:flex;align-items:flex-start;padding:7px 6px;border-bottom:1px solid #1a1a1a;min-height:44px}
.cw{width:28px;flex-shrink:0;padding-top:3px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cd{width:15px;height:15px;border-radius:50%;display:block}
.pb{font-size:10px;color:#fa0;font-weight:bold}
.sy{flex:1;font-size:15px;color:#0ff;line-height:1.65;word-break:break-all;white-space:pre-wrap}
.memo-ta{width:100%;background:transparent;color:#ddd;font-size:15px;resize:none;border:none;outline:none;padding:10px;min-height:180px}
.memo-ta::placeholder{color:#333}
.ip{flex:1;overflow-y:auto;display:none;padding:12px;-webkit-overflow-scrolling:touch}
.ip.active{display:block}
.sc{background:#1a1a1a;border-radius:12px;padding:14px;margin-bottom:12px}
.sh{font-size:13px;color:#fa0;font-weight:bold;margin-bottom:10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.si{display:flex;align-items:center;gap:6px;font-size:14px}
.sd{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.g-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:#aaa}
.g-inp{background:#0d0d0d;color:#fff;border:2px solid #1e3fa0;border-radius:8px;padding:5px 8px;font-size:16px;width:80px;text-align:center}
.upd-btn{background:#1e3fa0;border:none;border-radius:8px;color:#fff;padding:6px 12px;font-size:14px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.thd{color:#666;border-bottom:1px solid #333}
.hint{margin-top:8px;font-size:11px;color:#555}
.input-area{flex-shrink:0;background:#141414;border-top:1px solid #2a2a2a;padding:5px 6px 6px}
.crb{display:flex;gap:5px;margin-bottom:5px}
.char-btn{flex:1;height:46px;background:#202020;border:2px solid transparent;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sel-red{border-color:#e44}.sel-green{border-color:#3d3}.sel-blue{border-color:#55f}
.cbdot{width:20px;height:20px;border-radius:50%}
.c-red{background:#e44}.c-green{background:#3d3}.c-blue{background:#55f}
.sg2{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:5px}
.sb{height:46px;background:#202020;border:none;border-radius:10px;color:#fff;font-size:20px;cursor:pointer}
.sb:active{background:#383838}
.sb-sp{font-size:16px;color:#fa0}.sb-bk{font-size:15px;color:#e44}
.bf-row{display:flex;gap:5px;margin-bottom:5px}
.bw{flex:1;display:flex;align-items:center;justify-content:space-between;background:#202020;border:2px solid #a0660a;border-radius:10px;padding:0 4px;height:44px}
.bpm{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 5px}
.bv{font-size:17px;font-weight:bold;color:#fa0}
.fb{flex:1;height:44px;background:#202020;border:2px solid #333;border-radius:10px;color:#888;font-size:13px;cursor:pointer;font-weight:bold}
.fb.on{border-color:#0ff;color:#0ff;background:#001e1e}
.act-row{display:flex;gap:5px;margin-bottom:5px}
.cz-btn{flex:2;height:44px;background:#1e3fa0;border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.bk-btn{flex:1;height:44px;background:#2a2a2a;border:none;border-radius:10px;color:#fff;font-size:14px;cursor:pointer}
.nx-btn{width:100%;height:40px;background:#e8e8e8;border:none;border-radius:10px;color:#111;font-size:14px;cursor:pointer;margin-bottom:4px}
.bot-bar{display:flex;gap:5px}
.bb{flex:1;height:32px;background:#1e1e1e;border:none;border-radius:8px;color:#aaa;font-size:12px;cursor:pointer}
.bb.d{color:#e44}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
.ov.show{display:flex}
.mb{background:#222;border-radius:16px;padding:20px;width:88%;max-width:340px}
.mt{font-size:17px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mc{background:none;border:none;color:#888;font-size:22px;cursor:pointer}
.cb2{background:#1a1a1a;border-radius:16px;padding:22px;width:78%;max-width:280px;text-align:center}
.cm{font-size:15px;margin-bottom:18px;color:#ddd}
.ca{display:flex;justify-content:flex-end;gap:20px}
.cc{background:none;border:none;color:#3d6fe8;font-size:16px;cursor:pointer}
.co{background:none;border:none;color:#3d6fe8;font-size:16px;font-weight:bold;cursor:pointer}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300;white-space:nowrap}
#toast.show{opacity:1}
.tc{padding:6px 2px}.tcr{padding:6px 2px;text-align:right}.fw{font-weight:bold}
.dotS{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.dotX{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
<div class="top-bar"><div class="stw" id="stw"></div><div class="itb" id="itb" onclick="goInfo()">情報</div></div>
<div class="sub-bar" id="sb2"><div class="sub-tab" onclick="goSub('upper')">上メモ</div><div class="sub-tab active" onclick="goSub('point')">ポイント</div><div class="sub-tab" onclick="goSub('lower')">下メモ</div></div>
<div class="pane" id="pU"><textarea class="memo-ta" id="taU" placeholder="上部メモ..." oninput="saveMemo('upper')"></textarea></div>
<div class="pane active" id="pP"><div id="pd"></div></div>
<div class="pane" id="pL"><textarea class="memo-ta" id="taL" placeholder="下部メモ..." oninput="saveMemo('lower')"></textarea></div>
<div class="ip" id="ip">
<div class="sc"><div class="sh">発光率</div>
<div class="sg">
<div class="si"><span class="sd" style="background:#e44"></span><span id="sR">0/0 (0.0%)</span></div>
<div class="si"><span class="sd" style="background:#3d3"></span><span id="sG">0/0 (0.0%)</span></div>
<div class="si" style="grid-column:span 2"><span class="sd" style="background:#e44;margin-right:2px"></span><span class="sd" style="background:#3d3"></span>&nbsp;<span id="sRG">0/0 (0.0%)</span></div>
<div class="si"><span class="sd" style="background:#55f"></span><span id="sB">0/0 (0.0%)</span></div>
</div>
<div style="color:#fa0;font-size:14px;margin-top:8px">🔔 <span id="sBell">0</span></div>
<div class="g-row"><span>総G数:</span><input type="number" class="g-inp" id="tgInp" value="0" inputmode="numeric"><button class="upd-btn" onclick="updateTotalG()">更新</button></div>
</div>
<div class="sc"><div class="sh">CZ到達PT平均</div>
<table class="tbl"><tr class="thd"><td class="tc">キャラ</td><td class="tcr">合計PT</td><td class="tcr">回数</td><td class="tcr">平均PT</td></tr>
<tr id="czR"></tr><tr id="czG"></tr><tr id="czRG" style="border-bottom:1px solid #333"></tr><tr id="czB"></tr>
</table></div>
<div class="sc"><div class="sh">確率</div>
<table class="tbl"><tr class="thd"><td class="tc">項目</td><td class="tcr">回数</td><td class="tcr">G数</td><td class="tcr">確率</td></tr>
<tr id="pBell"></tr><tr id="pAT" style="border-top:1px solid #222"></tr><tr id="pCZ" style="border-top:1px solid #222"></tr><tr id="pUCZ" style="border-top:1px solid #222"></tr>
</table>
<div class="hint">累計通常G数: <span id="tng">0</span>G</div>
</div>
<div style="background:#1a1a1a;border-radius:12px;overflow:hidden"><textarea class="memo-ta" id="taGl" placeholder="全体メモ..." style="min-height:120px" oninput="saveGlobal()"></textarea></div>
</div>
<div class="input-area" id="ia">
<div class="crb">
<button class="char-btn sel-red" id="bR" onclick="selChar('red')"><span class="cbdot c-red"></span></button>
<button class="char-btn" id="bG" onclick="selChar('green')"><span class="cbdot c-green"></span></button>
<button class="char-btn" id="bB" onclick="selChar('blue')"><span class="cbdot c-blue"></span></button>
</div>
<div class="sg2" id="sg2">
<button class="sb" data-s="○">○</button>
<button class="sb" data-s="◎">◎</button>
<button class="sb" data-s="●">●</button>
<button class="sb" data-s="☆">☆</button>
<button class="sb" data-s="★">★</button>
<button class="sb" data-s="◇">◇</button>
<button class="sb" data-s="◆">◆</button>
<button class="sb" data-s="＊">＊</button>
<button class="sb sb-sp" data-s="↓">↓</button>
<button class="sb sb-sp" data-s="/">/ </button>
<button class="sb sb-bk" onclick="doBack()">戻</button>
<button class="sb" style="opacity:0;pointer-events:none"></button>
</div>
<div class="bf-row">
<div class="bw"><button class="bpm" onclick="chgBell(-1)">－</button><span style="font-size:16px">🔔</span><span class="bv" id="bellVal">0</span><button class="bpm" onclick="chgBell(1)">＋</button></div>
<button class="fb" id="flashBtn" onclick="togFlash()">発光中</button>
</div>
<div class="act-row" id="actRow"></div>
<button class="nx-btn" onclick="nextSet()">次セット▶ポイント集計</button>
<div class="bot-bar">
<button class="bb" onclick="copyHist()">履歴コピー</button>
<button class="bb d" onclick="openDelLast()">最後削除</button>
<button class="bb d" onclick="openReset()">リセット</button>
</div>
</div>
</div>
<div class="ov" id="nsOv"><div class="cb2" style="width:88%;max-width:320px;text-align:left"><div style="font-size:16px;font-weight:bold;margin-bottom:14px;color:#fff;text-align:center">次セット</div><div style="margin-bottom:14px"><div style="font-size:13px;color:#aaa;margin-bottom:6px">通常G数（このセット前）</div><input type="number" id="ngInp" inputmode="numeric" placeholder="0" style="background:#0d0d0d;color:#fff;border:2px solid #1e3fa0;border-radius:8px;padding:8px 12px;font-size:18px;width:100%;text-align:center;outline:none"></div><div style="font-size:14px;color:#ddd;margin-bottom:12px;text-align:center">ポイント引き継ぐ？</div><div style="display:flex;gap:10px"><button onclick="doNextSet(false)" style="flex:1;height:44px;background:#2a2a2a;border:2px solid #555;border-radius:10px;color:#fff;font-size:15px;cursor:pointer">いいえ</button><button onclick="doNextSet(true)" style="flex:1;height:44px;background:#1e3fa0;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:bold;cursor:pointer">はい ▶</button></div></div></div>
<div class="ov" id="dlOv"><div class="cb2"><div class="cm">最後のセットを削除しますか？</div><div class="ca"><button class="cc" onclick="closeDL()">キャンセル</button><button class="co" onclick="doDL()">OK</button></div></div></div>
<div class="ov" id="rsOv"><div class="cb2"><div class="cm">データをリセットしますか？</div><div class="ca"><button class="cc" onclick="closeRS()">キャンセル</button><button class="co" onclick="doRS()">OK</button></div></div></div>
<div id="toast">コピーしました</div>
<script>
var gi=document.getElementById.bind(document);
const SP={'○':1,'◎':15,'●':15,'☆':15,'★':30,'◇':30,'◆':60,'＊':0,'/':0,'↓':0};
const CH=['red','green','blue'];
const CE={red:'🔴',green:'🟢',blue:'🔵'};
const DC={red:'#e44',green:'#3d3',blue:'#55f'};
const KM=['①','②','③','④','⑤','⑥'];
function ncd(cp=null){return{lines:[[]],carryPt:cp};}
function ns(cr=null,cg=null){return{red:ncd(cr),green:ncd(cg),blue:ncd(null),upperMemo:'',lowerMemo:'',bell:0,blueKyoki:0,normalG:0};}
function hasCZ(d){return d.lines.some(function(l){return l.some(function(s){return(s[0]==='.'||s.startsWith('🟣'))&&s.length>1;});});}
let S={cur:0,sub:'point',info:false,char:'red',flashC:{red:0,green:0,blue:0},totalG:0,globalMemo:'',sets:[ns()]};
function save(){localStorage.setItem('kb2v4',JSON.stringify(S));}
function load(){try{var d=localStorage.getItem('kb2v4');if(d)S=JSON.parse(d);}catch(e){}}
function cs(){return S.sets[S.cur];}
function calcPt(d,bl){
  var li=-1;
  d.lines.forEach(function(l,i){if(l.some(function(s){return bl?/^[①②③④⑤⑥]/.test(s):(s[0]==='.'||s.startsWith('🟣'))&&s.length>1;}))li=i;});
  var pt=0;
  d.lines.forEach(function(l,i){if(i<=li)return;l.forEach(function(s){pt+=SP[s.replace(/\[|\]/g,'')]||0;});});
  return pt;
}
function calcFR(lines){
  var n=0,f=0;
  lines.forEach(function(l){l.forEach(function(s){var ib=s.startsWith('['),r=s.replace(/\[|\]/g,'');if(r==='○'&&!ib)n++;if(r==='◎'&&!ib)f++;});});
  var d=n+f;return{flash:f,denom:d,rate:d>0?(f/d*100).toFixed(1):'0.0'};
}
function tbel(){return S.sets.reduce(function(s,st){return s+(st.bell||0);},0);}
function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderAll(){
  renderTabs();
  if(S.info){showInfo();return;}
  showSet();renderSubTabs();renderPoints();loadMemos();syncCh();syncFb();renderAct();
  gi('bellVal').textContent=tbel();
}
function renderTabs(){
  gi('stw').innerHTML=S.sets.map(function(s,i){return'<div class="st'+((!S.info&&S.cur===i)?' active':'')+'" onclick="goSet('+i+')">【'+(i+1)+'】</div>';}).join('');
  gi('itb').className='itb'+(S.info?' active':'');
}
function renderSubTabs(){
  var ss=['upper','point','lower'],ids=['pU','pP','pL'];
  document.querySelectorAll('.sub-tab').forEach(function(el,i){el.className='sub-tab'+(S.sub===ss[i]?' active':'');});
  ids.forEach(function(id,i){gi(id).className='pane'+(S.sub===ss[i]?' active':'');});
}
function renderPoints(){
  var set=cs();
  gi('pd').innerHTML=CH.map(function(c){
    var d=set[c],cp=d.carryPt;
    var hCZ=c!=='blue'&&hasCZ(d);
    var pt=c==='blue'?calcPt(d,1):(hCZ?0:(cp||0))+calcPt(d);
    var txt='';
    if(cp!==null&&cp>0)txt+='('+cp+')→\n';
    txt+=d.lines.map(function(l){return l.join('');}).filter(function(l,i,a){return l.length>0||(i===0&&a.length===1);}).join('\n');
    return '<div class="cr"><div class="cw"><span class="cd" style="background:'+DC[c]+'"></span><span class="pb">'+pt+'</span></div><div class="sy">'+escH(txt)+'</div></div>';
  }).join('');
}
function showSet(){
  gi('sb2').style.display='flex';
  gi('ia').style.display='block';
  gi('ip').className='ip';
}
function showInfo(){
  gi('sb2').style.display='none';
  gi('ia').style.display='none';
  ['pU','pP','pL'].forEach(function(n){gi(n).className='pane';});
  gi('ip').className='ip active';
  renderStats();
}
function dot(col,x){return'<span class="dot'+(x?'X':'S')+'" style="background:'+col+'"></span>';}
function tc(v,r,c){return'<td class="tc'+(r?'r':'')+'"'+(c?' style="color:'+c+'"':'')+'>'+v+'</td>';}
function renderStats(){
  var aL={red:[],green:[],blue:[]},bs=0;
  S.sets.forEach(function(st){CH.forEach(function(c){aL[c].push.apply(aL[c],st[c].lines);});bs+=st.bell||0;});
  var rR=calcFR(aL.red),rG=calcFR(aL.green),rB=calcFR(aL.blue);
  var rRG={flash:rR.flash+rG.flash,denom:rR.denom+rG.denom};
  rRG.rate=rRG.denom>0?(rRG.flash/rRG.denom*100).toFixed(1):'0.0';
  function fs(r){return r.flash+'/'+r.denom+' ('+r.rate+'%)';}
  gi('sR').textContent=fs(rR);
  gi('sG').textContent=fs(rG);
  gi('sRG').textContent=fs(rRG);
  gi('sB').textContent=fs(rB);
  gi('sBell').textContent=bs;
  gi('tgInp').value=S.totalG;
  gi('taGl').value=S.globalMemo||'';
  var cz={red:{t:0,n:0},green:{t:0,n:0},blue:{t:0,n:0}},czCnt=0,czuCnt=0;
  S.sets.forEach(function(st){
    ['red','green'].forEach(function(c){st[c].lines.forEach(function(l){l.forEach(function(s){
      var m=s.match(/^\.(\d+)$/);if(m){cz[c].t+=parseInt(m[1]);cz[c].n++;czCnt++;}
      if(s.startsWith('🟣')&&s.length>2){cz[c].t+=parseInt(s.slice(2));cz[c].n++;czuCnt++;}
    });});});
    st.blue.lines.forEach(function(l){l.forEach(function(s){var m=s.match(/^[①-⑥][.(](\d+)[)]?$/);if(m){cz.blue.t+=parseInt(m[1]);cz.blue.n++;}});});
  });
  czCnt+=czuCnt;
  function czRow(id,dh,c){
    var avg=c.n>0?(c.t/c.n).toFixed(1):'－',ac=c.n>0?'#e44':'#555';
    gi(id).innerHTML=tc(dh)+tc(c.n>0?c.t:'－',1,'#ccc')+tc(c.n,1,'#ccc')+'<td class="tcr fw" style="color:'+ac+'">'+avg+(c.n>0?'pt':'')+'</td>';
  }
  czRow('czR',dot(DC.red),cz.red);czRow('czG',dot(DC.green),cz.green);czRow('czB',dot(DC.blue),cz.blue);
  var rgt=cz.red.t+cz.green.t,rgn=cz.red.n+cz.green.n,rga=rgn>0?(rgt/rgn).toFixed(1):'－';
  gi('czRG').innerHTML=tc(dot('#e44',1)+'+'+dot('#3d3',1))+tc(rgn>0?rgt:'－',1,'#888')+tc(rgn,1,'#888')+'<td class="tcr fw" style="color:'+(rgn>0?'#fa0':'#555')+'">'+rga+(rgn>0?'pt':'')+'</td>';
  var tng=S.sets.reduce(function(s,st){return s+(st.normalG||0);},0);
  var atCnt=Math.max(0,S.sets.length-1);
  function ps(n,g){if(!g||!n)return'－';return'1/'+(g/n).toFixed(1);}
  function pRow(id,lbl,n,g,lc){gi(id).innerHTML=tc(lbl,0,lc||'#aaa')+tc(n,1,'#ccc')+tc(g+'G',1,'#666')+'<td class="tcr fw" style="color:#fff">'+ps(n,g)+'</td>';}
  pRow('pBell','🔔ベル',bs,S.totalG,'#fa0');
  pRow('pAT','初当り',atCnt,tng);
  pRow('pCZ','🔴🟢CZ',czCnt,tng);
  pRow('pUCZ','🟣上位CZ',czuCnt,tng,'#b07aff');
  gi('tng').textContent=tng;
}
function loadMemos(){
  var set=cs();
  gi('taU').value=set.upperMemo||'';
  gi('taL').value=set.lowerMemo||'';
  gi('bellVal').textContent=tbel();
}
function syncCh(){
  gi('bR').className='char-btn'+(S.char==='red'?' sel-red':'');
  gi('bG').className='char-btn'+(S.char==='green'?' sel-green':'');
  gi('bB').className='char-btn'+(S.char==='blue'?' sel-blue':'');
}
function syncFb(){
  var b=gi('flashBtn');
  b.className=S.flashC[S.char]?'fb on':'fb';
  b.textContent=S.flashC[S.char]?'発光中 ON':'発光中';
}
function renderAct(){
  var r=gi('actRow');
  if(S.char==='blue'){
    r.innerHTML='<button class="cz-btn" onclick="doKyoki()">周期</button><button class="cz-btn" onclick="doGT()" style="background:#555">G数</button><button class="bk-btn" onclick="doBack()">戻る</button>';
  }else{
    r.innerHTML='<button class="cz-btn" onclick="doCZ()">CZ</button><button class="cz-btn" style="background:#7b2fa8" onclick="doCZU()">🟣</button><button class="bk-btn" onclick="doBack()">戻る</button>';
  }
}
function goSet(i){S.cur=i;S.info=false;renderAll();}
function goInfo(){S.info=true;renderTabs();showInfo();}
function goSub(s){S.sub=s;renderSubTabs();if(s==='point')renderPoints();save();}
function selChar(c){S.char=c;syncCh();syncFb();renderAct();save();}
function addSym(sym){
  var set=cs(),s=S.flashC[S.char]?'['+sym+']':sym;
  set[S.char].lines[set[S.char].lines.length-1].push(s);
  if(S.sub==='point')renderPoints();save();
}
function togFlash(){S.flashC[S.char]^=1;syncFb();}
function chgBell(d){var set=cs();set.bell=Math.max(0,(set.bell||0)+d);gi('bellVal').textContent=tbel();save();}
function doCZ(){
  var set=cs(),d=set[S.char],pt=(d.carryPt||0)+calcPt(d);
  d.lines[d.lines.length-1].push('.'+pt);d.lines.push([]);
  if(S.sub==='point')renderPoints();save();
}
function doCZU(){
  var set=cs(),d=set[S.char],pt=(d.carryPt||0)+calcPt(d);
  d.lines[d.lines.length-1].push('🟣'+pt);d.lines.push([]);
  if(S.sub==='point')renderPoints();save();
}
function doKyoki(){
  var set=cs(),d=set.blue,pt=calcPt(d,1),mk=KM[set.blueKyoki||0];
  d.lines[d.lines.length-1].push(mk+'.'+pt);d.lines.push([]);
  set.blueKyoki=(set.blueKyoki||0)+1;
  if(S.sub==='point')renderPoints();save();
}
function doGT(){
  var set=cs(),d=set.blue,pt=calcPt(d,1),mk=KM[set.blueKyoki||0];
  d.lines[d.lines.length-1].push(mk+'('+pt+')');d.lines.push([]);
  set.blueKyoki=(set.blueKyoki||0)+1;
  if(S.sub==='point')renderPoints();save();
}
function doBack(){
  var set=cs(),lines=set[S.char].lines;
  for(var i=lines.length-1;i>=0;i--){
    if(lines[i].length>0){
      var r=lines[i].pop();
      if(S.char==='blue'&&/^[①②③④⑤⑥]/.test(r))set.blueKyoki=Math.max(0,(set.blueKyoki||1)-1);
      while(lines.length>1&&lines[lines.length-1].length===0)lines.pop();
      break;
    }
  }
  if(S.sub==='point')renderPoints();save();
}
function nextSet(){
  gi('ngInp').value='';
  gi('nsOv').classList.add('show');
  setTimeout(function(){gi('ngInp').focus();},100);
}
function doNextSet(carry){
  var ng=parseInt(gi('ngInp').value)||0;
  gi('nsOv').classList.remove('show');
  var set=cs();set.normalG=ng;
  if(carry){
    var hR=hasCZ(set.red),hG=hasCZ(set.green);
    var pR=(hR?0:(set.red.carryPt||0))+calcPt(set.red);
    var pG=(hG?0:(set.green.carryPt||0))+calcPt(set.green);
    ['red','green'].forEach(function(c){var d=set[c],p=c==='red'?pR:pG;if(p>0)d.lines[d.lines.length-1].push('('+p+')');});
    S.sets.push(ns(pR,pG));
  }else{S.sets.push(ns(null,null));}
  S.cur=S.sets.length-1;S.sub='point';renderAll();save();
}
function copyHist(){
  var out='【集計】\n総G数：'+S.totalG+'G\n';
  var aL={red:[],green:[],blue:[]},bs=0;
  S.sets.forEach(function(st){CH.forEach(function(c){aL[c].push.apply(aL[c],st[c].lines);});bs+=st.bell||0;});
  out+='🔔'+bs+'\n';
  CH.forEach(function(c){var r=calcFR(aL[c]);out+=CE[c]+r.flash+'/'+r.denom+' ('+r.rate+'%)\n';});
  out+='\n';
  S.sets.forEach(function(st,i){
    out+='【'+(i+1)+'】\n';
    if(st.upperMemo)out+=st.upperMemo+'\n\n';
    CH.forEach(function(c){var d=st[c],cp=d.carryPt,txt='';if(cp!==null&&cp>0)txt+='('+cp+')→\n';txt+=d.lines.map(function(l){return l.join('');}).filter(function(l){return l.length>0;}).join('\n');if(txt.trim())out+=CE[c]+txt+'\n';});
    if(st.lowerMemo)out+='\n'+st.lowerMemo+'\n';
    out+='\n';
  });
  if(S.globalMemo)out+=S.globalMemo;
  var text=out.trim();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(showToast).catch(function(){fbCopy(text);});}
  else fbCopy(text);
}
function fbCopy(text){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast();}
function showToast(){var t=gi('toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1500);}
function saveMemo(type){var set=cs();if(type==='upper')set.upperMemo=gi('taU').value;else set.lowerMemo=gi('taL').value;save();}
function saveGlobal(){S.globalMemo=gi('taGl').value;save();}
function updateTotalG(){S.totalG=parseInt(gi('tgInp').value)||0;save();renderStats();}
function openDelLast(){if(S.sets.length<=1){showToast();return;}gi('dlOv').classList.add('show');}
function closeDL(){gi('dlOv').classList.remove('show');}
function doDL(){if(S.sets.length<=1)return;S.sets.pop();S.cur=S.sets.length-1;closeDL();renderAll();save();}
function openReset(){gi('rsOv').classList.add('show');}
function closeRS(){gi('rsOv').classList.remove('show');}
function doRS(){localStorage.removeItem('kb2v4');S={cur:0,sub:'point',info:false,char:'red',flashC:{red:0,green:0,blue:0},totalG:0,globalMemo:'',sets:[ns()]};closeRS();renderAll();}
load();
S.flashC=S.flashC||{red:0,green:0,blue:0};
var lpT=null;
(function(){
  var el=gi('sg2');
  function ep(){if(lpT){clearTimeout(lpT);lpT=null;}}
  el.addEventListener('pointerdown',function(e){
    var s=e.target.dataset.s;
    if(!s)return;
    e.preventDefault();
    if(s==='↓'){var c=cs();[c.red,c.green].forEach(function(d){d.lines[d.lines.length-1].push('↓');});if(S.sub==='point')renderPoints();save();return;}
    if('★◇◆'.indexOf(s)>=0){if(lpT)clearTimeout(lpT);lpT=setTimeout(function(){lpT=null;addSym(s);},450);}
    else{addSym(s);}
  });
  el.addEventListener('pointerup',ep);
  el.addEventListener('pointercancel',ep);
  el.addEventListener('pointerleave',ep);
})();
renderAll();
</script>
</body>
</html>
